name: kuma-alerts

services:
  backend:
    build:
      context: ../backend
    image: kuma-alerts-backend:latest
    container_name: kuma-alerts-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - ../config/.env
    environment:
      DATA_DIR: /data
      LOG_DIR: /logs
      TZ: Asia/Tokyo
    volumes:
      - ../data:/data
      - ../logs:/logs
    networks:
      - default
      - radio-alerts
    ports:
      - "127.0.0.1:3000:3000"
    cpus: "1.0"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.27-alpine
    container_name: kuma-alerts-web
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx/radio-alerts.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  radio-alerts:
    external: true
    name: radio-alerts
