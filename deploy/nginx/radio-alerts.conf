resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $backend "backend:3000";

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 16k;

    include /etc/nginx/conf.d/snippets/security-headers.inc;

    location = /internal {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location = /api/alert/stream {
        proxy_pass http://$backend;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$backend;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_read_timeout 15s;
        limit_except GET {
            deny all;
        }
    }

    location = /health {
        proxy_pass http://$backend;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_read_timeout 10s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
