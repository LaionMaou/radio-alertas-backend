resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    set $backend "backend:3000";
    # install.sh lo reemplaza; nginx lo inyecta en el proxy del stop, así que
    # /internal/* nunca queda accesible desde fuera.
    set $internal_token "__INTERNAL_TOKEN__";

    ssl_certificate /etc/certs/fullchain.pem;
    ssl_certificate_key /etc/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 16k;

    include /etc/nginx/conf.d/snippets/security-headers.inc;

    location = /internal {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location = /api/alert/stream {
        proxy_pass http://$backend;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$backend;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_read_timeout 15s;
        limit_except GET {
            deny all;
        }
    }

    # El único POST público: cortar el bucle de 大津波警報. Va con contraseña
    # por operador (deploy/operators.sh) para que nadie de internet silencie
    # la alerta.
    location = /api/stop {
        auth_basic "Kuma Radio - operadores";
        auth_basic_user_file /etc/nginx/conf.d/operator.htpasswd;
        limit_except POST {
            deny all;
        }
        proxy_pass http://$backend/internal/stop-tts;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_set_header Authorization "Bearer $internal_token";
        proxy_read_timeout 20s;
    }

    location = /health {
        proxy_pass http://$backend;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_read_timeout 10s;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
