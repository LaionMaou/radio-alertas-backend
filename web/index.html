<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>くまラジオ 緊急警報</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">本文へ</a>

<header class="topbar">
  <div class="brand">
    <h1 class="brand-title">くまラジオ 緊急警報</h1>
    <p class="brand-sub">放送スタッフ用モニター</p>
  </div>
  <div class="topbar-status">
    <span id="link-status" class="pill" data-tone="unknown" role="status">接続中</span>
    <span id="p2p-status" class="pill" data-tone="unknown" role="status">P2P 確認中</span>
    <span id="mode-pill" class="pill" data-tone="unknown" hidden>DRY-RUN</span>
    <time id="clock" class="clock">----/--/-- --:--:--</time>
  </div>
</header>

<main id="main">
  <section class="panel" aria-live="polite">
    <div id="alert-empty" class="empty">
      <p class="empty-title">現在、有効な警報はありません</p>
      <p class="empty-hint">新しい情報が届くと自動で表示されます。</p>
    </div>

    <article id="alert-card" class="card" hidden aria-labelledby="alert-title">
      <div class="card-head">
        <span id="alert-kind" class="badge badge--kind">警報</span>
        <span id="alert-status" class="badge badge--status">発生</span>
        <span id="alert-tts" class="badge badge--tts">放送なし</span>
        <time id="alert-time" class="card-time"></time>
      </div>
      <h2 id="alert-title" class="card-title"></h2>
      <p id="alert-summary" class="card-summary"></p>
      <dl id="alert-details" class="details"></dl>
      <div class="card-foot">
        <p id="alert-meta" class="card-meta"></p>
        <button id="unpin" class="link-button" type="button" hidden>最新の警報に戻る</button>
      </div>
    </article>
  </section>

  <section class="history" aria-labelledby="history-title">
    <h2 id="history-title" class="section-title">履歴</h2>
    <ol id="history-list" class="history-list"></ol>
    <p id="history-empty" class="empty-hint" hidden>履歴はまだありません。</p>
  </section>
</main>

<footer class="foot">
  <p>P2PQuake と気象庁の情報をもとに表示しています。放送の判断は必ず公式情報で確認してください。</p>
</footer>

<noscript><p class="noscript">この画面の表示には JavaScript が必要です。</p></noscript>
</body>
</html>
